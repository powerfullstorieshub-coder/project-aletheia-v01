openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: calculations
    description: Versioned calculation operations
  - name: ai
    description: Secure VÆRIXON chat generation
paths:
  /v1/calculate:
    post:
      operationId: calculateExpression
      tags: [calculations]
      summary: Evaluate a safe arithmetic expression
      description: Public, unauthenticated endpoint backed by the VÆRIXON Calculation Engine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculationInput"
      responses:
        "200":
          description: Expression calculated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationSuccess"
        "400":
          description: Malformed JSON or invalid request shape
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationErrorResponse"
        "413":
          description: Request body exceeds the 8 KiB limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationErrorResponse"
        "415":
          description: Request content type is not application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationErrorResponse"
        "422":
          description: Expression is invalid or cannot produce a finite real result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationErrorResponse"
  /v1/ai/chat:
    post:
      operationId: createAiChatCompletion
      tags: [ai]
      summary: Stream a VÆRIXON chat completion
      description: >
        Proxies OpenAI-compatible chat messages to Pollinations using a server-side
        secret key. The key is never accepted from or returned to the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatInput"
      responses:
        "200":
          description: OpenAI-compatible server-sent event stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Malformed JSON or invalid chat messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatErrorResponse"
        "403":
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatErrorResponse"
        "413":
          description: Request body exceeds the chat request limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatErrorResponse"
        "415":
          description: Request content type is not application/json
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatErrorResponse"
        "429":
          description: Provider or local request rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatErrorResponse"
        "502":
          description: Provider authentication, model, network, or response failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatErrorResponse"
        "503":
          description: Provider is unavailable or the server key is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatErrorResponse"
        "504":
          description: Provider request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    CalculationInput:
      type: object
      properties:
        expression:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - expression
      additionalProperties: false
    CalculationSuccess:
      type: object
      properties:
        success:
          type: boolean
          const: true
        expression:
          type: string
        result:
          type: number
      required:
        - success
        - expression
        - result
      additionalProperties: false
    CalculationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: "#/components/schemas/CalculationError"
      required:
        - success
        - error
      additionalProperties: false
    CalculationError:
      type: object
      properties:
        code:
          type: string
          enum:
            - INVALID_JSON
            - INVALID_REQUEST
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - INVALID_EXPRESSION
            - DIVISION_BY_ZERO
            - MODULO_BY_ZERO
            - UNSUPPORTED_OPERATION
            - EXPRESSION_TOO_LONG
            - EXPRESSION_TOO_COMPLEX
            - INTERNAL_SERVER_ERROR
        message:
          type: string
      required:
        - code
        - message
      additionalProperties: false
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
          minLength: 1
      required:
        - role
        - content
      additionalProperties: false
    AiChatInput:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/AiChatMessage"
      required:
        - messages
      additionalProperties: false
    AiChatErrorCode:
      type: string
      enum:
        - INVALID_JSON
        - PAYLOAD_TOO_LARGE
        - INTERNAL_SERVER_ERROR
        - AI_NOT_CONFIGURED
        - AI_INVALID_REQUEST
        - AI_ORIGIN_REJECTED
        - AI_RATE_LIMITED
        - AI_AUTHENTICATION_FAILED
        - AI_QUOTA_EXHAUSTED
        - AI_UNSUPPORTED_MODEL
        - AI_PROVIDER_UNAVAILABLE
        - AI_NETWORK_ERROR
        - AI_TIMEOUT
        - AI_INVALID_RESPONSE
    AiChatError:
      type: object
      properties:
        code:
          $ref: "#/components/schemas/AiChatErrorCode"
        message:
          type: string
      required:
        - code
        - message
      additionalProperties: false
    AiChatErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: "#/components/schemas/AiChatError"
      required:
        - error
      additionalProperties: false

